name: Automated Data Pipeline

on:
  repository_dispatch:
    types: [drive_data_updated]

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Data Science & Google API Libraries
        # Added the Google API libraries here!
        run: pip install pandas numpy scikit-learn google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Data Cleaning & Save to Drive
        # Pass the secret JSON to the Python script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python data_pipeline.py
